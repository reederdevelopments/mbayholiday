<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBayHoliday - Admin Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <!-- Login Screen -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Admin Login</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Username</label>
                    <input type="text" id="username" class="w-full border rounded p-2 focus:ring focus:ring-blue-200">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Password</label>
                    <input type="password" id="password" class="w-full border rounded p-2 focus:ring focus:ring-blue-200">
                </div>
                <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Log In</button>
                <p id="login-error" class="text-red-500 text-sm hidden text-center mt-2">Invalid credentials.</p>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard (Hidden by default) -->
    <div id="admin-screen" class="hidden flex-1 flex flex-col p-4 max-w-3xl mx-auto w-full">
        <h2 class="text-2xl font-bold mb-4 text-blue-600 mt-4">Add New Listing</h2>
        
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
            <form id="upload-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Name</label>
                    <input type="text" id="f-name" required class="w-full border rounded p-2" placeholder="e.g. Summer Music Fest">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Category</label>
                    <select id="f-category" class="w-full border rounded p-2" onchange="toggleDate()">
                        <option value="event">Event (Has a specific date)</option>
                        <option value="activity">Local To-Do (No specific date)</option>
                    </select>
                </div>

                <div id="date-container">
                    <label class="block text-sm font-semibold mb-1">Date & Time for sorting</label>
                    <input type="datetime-local" id="f-date" class="w-full border rounded p-2">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Display Time</label>
                    <input type="text" id="f-time" required class="w-full border rounded p-2" placeholder="e.g. 10:00 AM - 3:00 PM">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Image Filename</label>
                    <input type="text" id="f-image" required class="w-full border rounded p-2" placeholder="e.g. images/my-image.jpg">
                    <p class="text-xs text-gray-500 mt-1">Upload this image to your /images folder on GitHub.</p>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Price</label>
                    <input type="text" id="f-price" required class="w-full border rounded p-2" placeholder="e.g. Free, R150.00">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Location</label>
                    <input type="text" id="f-location" required class="w-full border rounded p-2" placeholder="e.g. Santos Beach">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Link (Optional)</label>
                    <input type="text" id="f-link" class="w-full border rounded p-2" placeholder="e.g. https://... or #">
                </div>

                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-semibold mb-1">Description</label>
                    <textarea id="f-description" required rows="3" class="w-full border rounded p-2"></textarea>
                </div>

                <div class="col-span-1 md:col-span-2 mt-2">
                    <button type="button" onclick="generateJSON()" class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 transition">Generate JSON</button>
                </div>
            </form>
        </div>

        <!-- Output Area -->
        <div id="output-area" class="hidden bg-gray-800 text-green-400 p-4 rounded-xl shadow-md mb-10">
            <h3 class="text-white font-bold mb-2">1. Paste this into your database.json file:</h3>
            <textarea id="json-output" rows="10" class="w-full bg-gray-900 text-green-400 p-2 rounded border-none focus:ring-0 font-mono text-sm" readonly></textarea>
            <button onclick="copyToClipboard()" class="mt-3 bg-gray-600 text-white px-4 py-2 rounded text-sm hover:bg-gray-700">Copy to Clipboard</button>
            <p class="text-white text-sm mt-4">2. Don't forget to upload your image file via the GitHub website to the <span class="font-bold text-yellow-300">/images</span> folder!</p>
        </div>
    </div>

    <script>
        // Simple client-side auth (Not highly secure, but stops casual public visitors)
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if (user === 'neil' && pass === 'neil@1234') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        // Hide date field if it's an activity
        function toggleDate() {
            const cat = document.getElementById('f-category').value;
            document.getElementById('date-container').style.display = (cat === 'activity') ? 'none' : 'block';
        }

        function generateJSON() {
            const category = document.getElementById('f-category').value;
            const linkVal = document.getElementById('f-link').value;
            
            // Format datetime-local to standard ISO for your DB
            let dateVal = null;
            if (category === 'event') {
                const rawDate = document.getElementById('f-date').value;
                if(rawDate) dateVal = rawDate + ":00"; // append seconds
            }

            const newEntry = {
                id: Math.floor(Math.random() * 1000000), // Generate unique ID
                name: document.getElementById('f-name').value,
                category: category,
                date: dateVal,
                time: document.getElementById('f-time').value,
                image: document.getElementById('f-image').value,
                link: linkVal ? linkVal : "#",
                price: document.getElementById('f-price').value,
                location: document.getElementById('f-location').value,
                description: document.getElementById('f-description').value
            };

            const formattedJSON = JSON.stringify(newEntry, null, 2) + ",";
            
            document.getElementById('json-output').value = formattedJSON;
            document.getElementById('output-area').classList.remove('hidden');
            
            // Scroll down to see output
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function copyToClipboard() {
            const copyText = document.getElementById("json-output");
            copyText.select();
            document.execCommand("copy");
            alert("Copied! Now open your database.json in GitHub and paste this at the top of the list.");
        }
    </script>
</body>
</html>
