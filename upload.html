<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBayHoliday - Admin Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>body { font-family: 'Nunito', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl border-4 border-blue-100 w-full max-w-md">
            <h2 class="text-3xl font-black mb-6 text-center text-blue-600">Admin Login</h2>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username" class="w-full border-2 rounded-xl p-3 focus:ring-4 focus:ring-blue-100 font-bold outline-none">
                <input type="password" id="password" placeholder="Password" class="w-full border-2 rounded-xl p-3 focus:ring-4 focus:ring-blue-100 font-bold outline-none">
                <button onclick="checkLogin()" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl hover:bg-blue-700 transition">Log In</button>
                <p id="login-error" class="text-red-500 font-bold hidden text-center mt-2">Invalid credentials.</p>
            </div>
        </div>
    </div>

    <div id="admin-screen" class="hidden flex-1 flex flex-col p-4 max-w-3xl mx-auto w-full pb-16">
        <h2 class="text-3xl font-black mb-6 text-blue-600 mt-4">Add New Listing</h2>
        
        <div class="bg-white p-8 rounded-3xl shadow-xl border-4 border-blue-50 mb-6">
            <form id="upload-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Name</label>
                    <input type="text" id="f-name" class="w-full border-2 rounded-xl p-2 font-bold" placeholder="e.g. Summer Music Fest">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Category</label>
                    <select id="f-category" class="w-full border-2 rounded-xl p-2 font-bold" onchange="toggleDate()">
                        <option value="event">Event</option>
                        <option value="activity">Local To-Do</option>
                    </select>
                </div>

                <div id="date-container">
                    <label class="block text-sm font-bold text-gray-600 mb-1">Start Date & Time</label>
                    <input type="datetime-local" id="f-date" class="w-full border-2 rounded-xl p-2 font-bold text-gray-600">
                </div>

                <div id="end-date-container">
                    <label class="block text-sm font-bold text-gray-600 mb-1">End Date (Optional for multi-day)</label>
                    <input type="datetime-local" id="f-end-date" class="w-full border-2 rounded-xl p-2 font-bold text-gray-600">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Display Time</label>
                    <input type="text" id="f-time" class="w-full border-2 rounded-xl p-2 font-bold" placeholder="e.g. 10:00 AM - 3:00 PM">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Sponsored Listing?</label>
                    <select id="f-sponsored" class="w-full border-2 rounded-xl p-2 font-bold text-yellow-600">
                        <option value="false">No (Standard)</option>
                        <option value="true">Yes (Featured Banner)</option>
                    </select>
                </div>

                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-600 mb-1">Image Filenames / URLs (Comma separated)</label>
                    <input type="text" id="f-images" class="w-full border-2 rounded-xl p-2 font-bold text-blue-600" placeholder="images/img1.jpg, https://...">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Price (Number only, 0 for free)</label>
                    <input type="number" id="f-price" class="w-full border-2 rounded-xl p-2 font-bold" placeholder="150">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Location Name</label>
                    <input type="text" id="f-location" class="w-full border-2 rounded-xl p-2 font-bold" placeholder="e.g. Santos Beach">
                </div>

                <!-- Map Picker Section -->
                <div class="col-span-1 md:col-span-2 mt-2">
                    <label class="block text-sm font-bold text-gray-600 mb-1">Pinpoint Location (Click map to set)</label>
                    <div id="map-picker" class="w-full h-64 rounded-xl border-2 z-10 mb-2 relative z-0"></div>
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Latitude</label>
                            <input type="number" step="any" id="f-lat" class="w-full border-2 rounded-xl p-2 font-bold bg-gray-50 text-gray-500" readonly>
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-bold text-gray-500 mb-1">Longitude</label>
                            <input type="number" step="any" id="f-lng" class="w-full border-2 rounded-xl p-2 font-bold bg-gray-50 text-gray-500" readonly>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Phone Number</label>
                    <input type="text" id="f-phone" class="w-full border-2 rounded-xl p-2 font-bold" placeholder="+27 00 000 0000">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-1">Website URL</label>
                    <input type="url" id="f-website" class="w-full border-2 rounded-xl p-2 font-bold" placeholder="https://...">
                </div>

                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-600 mb-1">Description</label>
                    <textarea id="f-description" rows="3" class="w-full border-2 rounded-xl p-2 font-bold"></textarea>
                </div>

                <div class="col-span-1 md:col-span-2 mt-2">
                    <button type="button" onclick="generateJSON()" class="w-full bg-green-500 text-white font-black py-4 rounded-xl shadow-lg hover:bg-green-600 transition">Generate JSON</button>
                </div>
            </form>
        </div>

        <div id="output-area" class="hidden bg-gray-900 text-green-400 p-6 rounded-3xl shadow-xl mb-10 border-4 border-gray-800">
            <h3 class="text-white font-black mb-3">Copy this into your database.json file:</h3>
            <textarea id="json-output" rows="12" class="w-full bg-black text-green-400 p-4 rounded-xl border-none focus:ring-0 font-mono text-sm" readonly></textarea>
            <button onclick="copyToClipboard()" class="mt-4 bg-white text-gray-900 font-bold px-6 py-3 rounded-xl text-sm hover:bg-gray-200 shadow-md">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        let pickerMap, pickerMarker;

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'neil' && pass === 'neil@1234') {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
                
                // Initialize map after container is visible
                setTimeout(() => {
                    initMapPicker();
                }, 100);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function initMapPicker() {
            // Center around Mossel Bay
            pickerMap = L.map('map-picker').setView([-34.183, 22.146], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(pickerMap);

            pickerMap.on('click', function(e) {
                const lat = e.latlng.lat.toFixed(6);
                const lng = e.latlng.lng.toFixed(6);
                document.getElementById('f-lat').value = lat;
                document.getElementById('f-lng').value = lng;
                
                if(pickerMarker) {
                    pickerMarker.setLatLng(e.latlng);
                } else {
                    pickerMarker = L.marker(e.latlng).addTo(pickerMap);
                }
            });
        }

        function toggleDate() {
            const cat = document.getElementById('f-category').value;
            const isAct = cat === 'activity';
            document.getElementById('date-container').style.display = isAct ? 'none' : 'block';
            document.getElementById('end-date-container').style.display = isAct ? 'none' : 'block';
        }

        function generateJSON() {
            const category = document.getElementById('f-category').value;
            
            let dateVal = null;
            let endDateVal = null;
            if (category === 'event') {
                const rawDate = document.getElementById('f-date').value;
                if(rawDate) dateVal = rawDate + ":00";
                const rawEndDate = document.getElementById('f-end-date').value;
                if(rawEndDate) endDateVal = rawEndDate + ":00";
            }

            const rawImages = document.getElementById('f-images').value;
            const imgArray = rawImages.split(',').map(item => item.trim()).filter(item => item);
            const isSponsored = document.getElementById('f-sponsored').value === 'true';

            const latVal = parseFloat(document.getElementById('f-lat').value);
            const lngVal = parseFloat(document.getElementById('f-lng').value);

            const newEntry = {
                id: Math.floor(Math.random() * 1000000),
                name: document.getElementById('f-name').value,
                category: category,
                sponsored: isSponsored,
                date: dateVal,
                endDate: endDateVal,
                time: document.getElementById('f-time').value,
                images: imgArray,
                phone: document.getElementById('f-phone').value,
                website: document.getElementById('f-website').value,
                price: parseInt(document.getElementById('f-price').value) || 0,
                location: document.getElementById('f-location').value,
                latitude: !isNaN(latVal) ? latVal : null,
                longitude: !isNaN(lngVal) ? lngVal : null,
                description: document.getElementById('f-description').value
            };

            const formattedJSON = JSON.stringify(newEntry, null, 2) + ",";
            document.getElementById('json-output').value = formattedJSON;
            document.getElementById('output-area').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function copyToClipboard() {
            const copyText = document.getElementById("json-output");
            copyText.select();
            document.execCommand("copy");
            alert("Copied!");
        }
    </script>
</body>
</html>
