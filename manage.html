<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Listing | MBayHoliday</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-200 via-blue-100 to-yellow-100 min-h-screen text-gray-800 antialiased flex flex-col justify-center py-10 px-4 relative">

    <div class="max-w-2xl w-full mx-auto bg-white/90 backdrop-blur-md rounded-[2rem] shadow-2xl overflow-hidden border-4 border-white p-6 md:p-10 relative">
        <a href="index.html" class="absolute top-6 left-6 text-gray-400 hover:text-blue-500 transition text-xl z-20"><i class="fa-solid fa-arrow-left"></i></a>
        
        <div class="text-center mb-8 mt-2">
            <img src="images/mbayholiday_logo.png" alt="MBayHoliday" class="h-16 mx-auto mb-3 rounded-xl shadow-sm">
            <h1 class="text-3xl font-black text-blue-600 tracking-tight drop-shadow-sm mb-1">Edit, Remove or Sponsor a Listing</h1>
            <p class="text-gray-500 font-bold text-sm">Select your listing below, choose the action required, and submit your request to our team.</p>
        </div>

        <form id="manage-form" class="space-y-6" onsubmit="submitForm(event)">
            
            <!-- Step 1: Search & Select Business -->
            <div class="bg-blue-50/50 border border-blue-100 rounded-2xl p-4 md:p-5 space-y-3">
                <label class="block text-xs font-black text-blue-900 uppercase tracking-wider">1. Search & Select Your Listing *</label>
                
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="Type to filter listing name..." class="w-full bg-white border border-gray-200 rounded-xl py-2.5 pl-10 pr-4 text-sm font-bold text-gray-700 outline-none focus:ring-2 focus:ring-blue-300 mb-2" onkeyup="filterDropdown()">
                </div>

                <select id="listing-select" required class="w-full bg-white border border-gray-200 rounded-xl p-3 font-bold text-gray-800 text-sm focus:ring-2 focus:ring-blue-300 outline-none" onchange="onListingSelected()">
                    <option value="">-- Loading listings... --</option>
                </select>

                <div id="selected-summary" class="hidden text-xs font-bold text-blue-800 bg-blue-100/80 p-3 rounded-xl border border-blue-200">
                    <i class="fa-solid fa-circle-info text-blue-600 mr-1"></i> <span id="summary-text"></span>
                </div>
            </div>

            <!-- Step 2: Action Checkboxes -->
            <div class="bg-amber-50/50 border border-amber-100 rounded-2xl p-4 md:p-5">
                <label class="block text-xs font-black text-amber-900 uppercase tracking-wider mb-3">2. What would you like to do? *</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <label class="flex items-center gap-2 font-bold text-gray-700 bg-white p-3 rounded-xl border border-gray-200 cursor-pointer hover:border-pink-300 transition">
                        <input type="checkbox" name="action-req" value="EDIT" class="accent-pink-500 w-5 h-5 rounded">
                        <span><i class="fa-solid fa-pen-to-square text-blue-500 mr-1"></i> Edit</span>
                    </label>
                    <label class="flex items-center gap-2 font-bold text-gray-700 bg-white p-3 rounded-xl border border-gray-200 cursor-pointer hover:border-pink-300 transition">
                        <input type="checkbox" name="action-req" value="DELETE" class="accent-pink-500 w-5 h-5 rounded">
                        <span><i class="fa-solid fa-trash-can text-red-500 mr-1"></i> Delete</span>
                    </label>
                    <label class="flex items-center gap-2 font-bold text-gray-700 bg-white p-3 rounded-xl border border-gray-200 cursor-pointer hover:border-pink-300 transition">
                        <input type="checkbox" name="action-req" value="SPONSOR" class="accent-pink-500 w-5 h-5 rounded">
                        <span><i class="fa-solid fa-crown text-yellow-500 mr-1"></i> Sponsor</span>
                    </label>
                </div>
            </div>

            <!-- Step 3: Contact Info -->
            <div class="space-y-4">
                <label class="block text-xs font-black text-gray-400 uppercase tracking-wider">3. Your Contact Details</label>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Your Full Name *</label>
                        <input type="text" id="user-name" required placeholder="e.g. John Doe" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-bold text-gray-700 focus:ring-2 focus:ring-blue-300 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Your Phone Number *</label>
                        <input type="text" id="user-phone" required placeholder="e.g. +27 82 123 4567" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-bold text-gray-700 focus:ring-2 focus:ring-blue-300 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Your Email Address *</label>
                    <input type="email" id="user-email" required placeholder="e.g. john@example.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-bold text-gray-700 focus:ring-2 focus:ring-blue-300 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Additional Details / Requested Changes</label>
                    <textarea id="user-notes" rows="4" placeholder="If editing, describe what needs updating (e.g. new phone number, updated times, new price)..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-bold text-gray-700 focus:ring-2 focus:ring-blue-300 outline-none"></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-pink-500 to-yellow-400 text-white font-black py-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition transform flex items-center justify-center text-lg">
                Generate Email Request <i class="fa-regular fa-paper-plane ml-2"></i>
            </button>
        </form>
    </div>

    <script>
        let allListings = [];

        async function loadListings() {
            try {
                const [eventsRes, restsRes] = await Promise.all([
                    fetch('database.json').catch(() => ({ json: () => [] })),
                    fetch('restaurant_database.json').catch(() => ({ json: () => [] }))
                ]);
                const events = await eventsRes.json();
                const rests = await restsRes.json();
                
                allListings = [
                    ...events.map(item => ({ ...item, typeLabel: item.category || 'Event/Activity' })),
                    ...rests.map(item => ({ ...item, typeLabel: item.type || 'Restaurant' }))
                ];

                allListings.sort((a, b) => a.name.localeCompare(b.name));
                populateSelect(allListings);
            } catch (e) {
                console.error("Failed to load listings", e);
            }
        }

        function populateSelect(list) {
            const select = document.getElementById('listing-select');
            select.innerHTML = '<option value="">-- Select or Search a Listing --</option>';
            list.forEach(item => {
                select.innerHTML += `<option value="${item.id}">${item.name} (${item.location} - ${item.typeLabel})</option>`;
            });
        }

        function filterDropdown() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allListings.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.location.toLowerCase().includes(query) ||
                item.typeLabel.toLowerCase().includes(query)
            );
            populateSelect(filtered);
        }

        function onListingSelected() {
            const id = parseInt(document.getElementById('listing-select').value);
            const summaryBox = document.getElementById('selected-summary');
            const summaryText = document.getElementById('summary-text');

            const item = allListings.find(i => i.id === id);
            if (item) {
                summaryText.innerText = `Selected: "${item.name}" at ${item.location} [ID: ${item.id}]`;
                summaryBox.classList.remove('hidden');
            } else {
                summaryBox.classList.add('hidden');
            }
        }

        function submitForm(e) {
            e.preventDefault();

            const selectEl = document.getElementById('listing-select');
            const selectedId = parseInt(selectEl.value);
            if (!selectedId) {
                alert('Please select a listing from the dropdown.');
                return;
            }

            const item = allListings.find(i => i.id === selectedId);

            const checkboxes = document.querySelectorAll('input[name="action-req"]:checked');
            if (checkboxes.length === 0) {
                alert('Please check at least one action (Edit, Delete, or Sponsor).');
                return;
            }

            const actions = Array.from(checkboxes).map(cb => cb.value);
            const userName = document.getElementById('user-name').value.trim();
            const userPhone = document.getElementById('user-phone').value.trim();
            const userEmail = document.getElementById('user-email').value.trim();
            const userNotes = document.getElementById('user-notes').value.trim() || 'None provided';

            // Subject generation rule: e.g. "EDIT, SPONSOR ENTRY - Jet Boarding Experience"
            const subjectTag = actions.join(', ') + " ENTRY";
            const subject = encodeURIComponent(`${subjectTag} - ${item.name}`);

            let body = `Hello MBayHoliday Team,\n\nI am requesting the following action(s) for a listing on MBayHoliday:\n\n`;
            body += `REQUEST TYPE: ${actions.join(', ')}\n\n`;
            body += `LISTING DETAILS:\n`;
            body += `- Name: ${item.name}\n`;
            body += `- Location: ${item.location}\n`;
            body += `- Category/Type: ${item.typeLabel}\n`;
            body += `- Listing ID: ${item.id}\n\n`;
            body += `REQUESTER CONTACT DETAILS:\n`;
            body += `- Full Name: ${userName}\n`;
            body += `- Phone: ${userPhone}\n`;
            body += `- Email: ${userEmail}\n\n`;
            body += `ADDITIONAL DETAILS / REQUESTED CHANGES:\n${userNotes}\n\n`;

            window.location.href = `mailto:reederdevelopments@gmail.com?subject=${subject}&body=${encodeURIComponent(body)}`;
        }

        document.addEventListener('DOMContentLoaded', loadListings);
    </script>
</body>
</html>
