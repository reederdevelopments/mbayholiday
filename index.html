<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-2596411121585604">
    <meta name="google-site-verification" content="QgIyntN7B1IkshgHWjAWPwkyNuYHMafYuRjia706wiA" />
    <title>MBayHoliday ☀️ Vacation Vibes</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2596411121585604" crossorigin="anonymous"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        .carousel-img { transition: opacity 0.5s ease-in-out; }
        /* Hide scrollbar for neatness */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-200 via-blue-100 to-yellow-100 min-h-screen text-gray-800 antialiased relative">

    <!-- Sticky Header & Filters Container -->
    <div class="sticky top-0 z-40 bg-white/80 backdrop-blur-md shadow-md">
        <!-- Header -->
        <header class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-3xl font-black text-pink-500 tracking-tight drop-shadow-sm">
                <i class="fa-solid fa-umbrella-beach text-yellow-400 mr-2"></i>MBayHoliday
            </h1>
            <button onclick="toggleFilters()" class="bg-blue-100 text-blue-700 font-bold px-4 py-2 rounded-xl shadow-sm hover:bg-blue-200 transition">
                <i class="fa-solid fa-filter mr-1"></i> Filters
            </button>
        </header>

        <!-- Collapsible Filters -->
        <section id="filter-section" class="max-w-5xl mx-auto px-4 hidden pb-4">
            <div class="bg-white rounded-2xl p-4 shadow-inner border border-gray-100 mt-2">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">📍 Location</label>
                        <select id="filter-location" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 font-bold text-blue-600 focus:ring-pink-300 outline-none" onchange="applyFilters()">
                            <option value="all">All Locations</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">🎟️ Type</label>
                        <select id="filter-category" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 font-bold text-blue-600 focus:ring-pink-300 outline-none" onchange="applyFilters()">
                            <option value="all">All Types</option>
                            <option value="event">Upcoming Events</option>
                            <option value="activity">Local To-Dos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">💸 Max Price: <span id="price-display" class="text-pink-500">R2000</span></label>
                        <input type="range" id="filter-price" min="0" max="2000" step="50" value="2000" class="w-full accent-pink-500" oninput="updatePriceLabel(); applyFilters()">
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Main Content Grid -->
    <main class="max-w-5xl mx-auto px-4 py-8 pb-16">
        <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Populated by JS -->
        </div>
        <p id="no-results" class="hidden text-center text-xl font-bold text-gray-500 mt-10">🌴 No activities match your filters.</p>
    </main>

    <!-- Popup Modal -->
    <div id="event-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300 relative" id="modal-content-box">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 text-gray-800 rounded-full w-8 h-8 flex items-center justify-center shadow-md hover:bg-gray-200 z-20"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="p-6">
                <h2 id="modal-title" class="text-2xl font-black text-gray-800 mb-4 pr-8 leading-tight"></h2>
                
                <!-- Modal Image Slider (Compact size) -->
                <div class="relative w-3/4 mx-auto h-32 bg-gray-100 rounded-xl overflow-hidden mb-4 shadow-inner group flex items-center justify-center">
                    <i class="fa-solid fa-image text-gray-300 text-3xl absolute"></i>
                    <img id="modal-img" src="" class="w-full h-full object-cover relative z-10 cursor-pointer" onclick="openLightbox()">
                    
                    <!-- Arrow Controls -->
                    <button id="modal-prev-btn" onclick="prevModalImage(event)" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/80 text-gray-800 w-8 h-8 rounded-full z-20 hidden items-center justify-center shadow hover:bg-white"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                    <button id="modal-next-btn" onclick="nextModalImage(event)" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/80 text-gray-800 w-8 h-8 rounded-full z-20 hidden items-center justify-center shadow hover:bg-white"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                </div>

                <p id="modal-desc" class="text-gray-600 mb-4 text-sm"></p>
                
                <!-- Pricing Accordion -->
                <details class="mb-6 bg-gray-50 rounded-xl border border-gray-200 overflow-hidden">
                    <summary class="font-bold text-gray-700 p-3 cursor-pointer outline-none select-none flex items-center justify-between">
                        <span><i class="fa-solid fa-tags text-green-500 mr-2"></i> Pricing Details</span>
                        <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
                    </summary>
                    <div class="p-3 bg-white border-t border-gray-200 text-sm space-y-2" id="modal-prices">
                        <!-- Populated via JS -->
                    </div>
                </details>
                
                <!-- Icon Buttons -->
                <div class="flex justify-center gap-4">
                    <a id="modal-nav" href="#" target="_blank" class="w-12 h-12 flex items-center justify-center bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200 transition shadow-sm text-lg" title="Google Maps">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </a>
                    <a id="modal-phone" href="#" class="hidden w-12 h-12 items-center justify-center bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition shadow-sm text-lg" title="Call">
                        <i class="fa-solid fa-phone"></i>
                    </a>
                    <a id="modal-web" href="#" target="_blank" class="hidden w-12 h-12 items-center justify-center bg-pink-100 text-pink-700 rounded-full hover:bg-pink-200 transition shadow-sm text-lg" title="Website">
                        <i class="fa-solid fa-globe"></i>
                    </a>
                    <button onclick="shareEvent()" class="w-12 h-12 flex items-center justify-center bg-gray-100 text-gray-700 rounded-full hover:bg-gray-200 transition shadow-sm text-lg" title="Share">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Lightbox -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black/95 z-[60] flex items-center justify-center p-4 transition-opacity" onclick="closeLightbox()">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-3xl z-50"><i class="fa-solid fa-xmark"></i></button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] object-contain shadow-2xl rounded-lg" onclick="event.stopPropagation()">
    </div>

    <script>
        let allData = [];
        let carouselIntervals = [];
        
        // Modal Gallery State
        let currentModalImages = [];
        let currentModalImgIndex = 0;
        let currentEventData = null;

        async function loadData() {
            try {
                const response = await fetch('database.json');
                allData = await response.json();
                
                const locations = [...new Set(allData.map(item => item.location))];
                const locSelect = document.getElementById('filter-location');
                locations.forEach(loc => {
                    locSelect.innerHTML += `<option value="${loc}">${loc}</option>`;
                });

                applyFilters();
            } catch (error) {
                console.error("Failed to load database.json:", error);
            }
        }

        // Toggle Filter Section
        function toggleFilters() {
            const filterSec = document.getElementById('filter-section');
            filterSec.classList.toggle('hidden');
        }

        function updatePriceLabel() {
            const val = document.getElementById('filter-price').value;
            document.getElementById('price-display').innerText = val == 2000 ? 'R2000+' : `R${val}`;
        }

        function applyFilters() {
            const catFilter = document.getElementById('filter-category').value;
            const locFilter = document.getElementById('filter-location').value;
            const priceFilter = parseInt(document.getElementById('filter-price').value);
            const now = new Date();

            let filtered = allData.filter(item => {
                if (catFilter !== 'all' && item.category !== catFilter) return false;
                if (locFilter !== 'all' && item.location !== locFilter) return false;
                if (priceFilter < 2000 && item.price > priceFilter) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (a.date && b.date) return new Date(a.date) - new Date(b.date);
                return 0;
            });

            renderContent(filtered, now);
        }

        function renderContent(data, now) {
            const container = document.getElementById('content-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';
            
            carouselIntervals.forEach(clearInterval);
            carouselIntervals = [];

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            data.forEach((item) => {
                const isPast = item.date ? new Date(item.date) < now : false;
                const imagesStr = encodeURIComponent(JSON.stringify(item.images || []));
                
                // Keep base price logic for the card summary
                const displayPrice = item.price === 0 ? 'Free' : `R${item.price}`;
                const firstImg = (item.images && item.images.length > 0) ? item.images[0] : '';

                const card = `
                    <div class="bg-white rounded-[2rem] shadow-xl border-4 border-white overflow-hidden cursor-pointer transform transition hover:-translate-y-2 hover:shadow-2xl ${isPast ? 'opacity-60' : ''}" onclick="openModal(${item.id})">
                        <div class="relative h-56 bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-image text-gray-300 text-4xl absolute"></i>
                            ${isPast ? '<div class="absolute inset-0 bg-white/50 backdrop-blur-[2px] z-30 flex items-center justify-center"><span class="bg-red-500 text-white font-black px-4 py-1 rounded-full shadow-lg">ENDED</span></div>' : ''}
                            <div class="absolute top-4 left-4 z-30 flex gap-2">
                                <span class="bg-white/90 text-pink-600 font-bold px-3 py-1 rounded-xl text-xs shadow-sm uppercase">${item.category}</span>
                            </div>
                            <img id="img-${item.id}" src="${firstImg}" data-images="${imagesStr}" data-index="0" class="w-full h-full object-cover carousel-img relative z-20" onerror="handleImageError(this)">
                        </div>
                        <div class="p-6 relative z-30 bg-white">
                            <h2 class="text-2xl font-black text-gray-800 mb-3 leading-tight">${item.name}</h2>
                            <div class="space-y-2 text-sm font-bold text-gray-500">
                                <p><i class="fa-regular fa-clock w-5 text-blue-400"></i> ${item.date ? formatDate(new Date(item.date)) + ' • ' : ''}${item.time}</p>
                                <p><i class="fa-solid fa-location-dot w-5 text-red-400"></i> ${item.location}</p>
                                <p><i class="fa-solid fa-tag w-5 text-green-400"></i> ${displayPrice}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            startCarousels();
        }

        function handleImageError(imgEl) {
            try {
                let imgArray = JSON.parse(decodeURIComponent(imgEl.getAttribute('data-images')));
                let currentIndex = parseInt(imgEl.getAttribute('data-index'));
                imgArray.splice(currentIndex, 1);
                
                if (imgArray.length > 0) {
                    imgEl.setAttribute('data-images', encodeURIComponent(JSON.stringify(imgArray)));
                    let nextIndex = currentIndex >= imgArray.length ? 0 : currentIndex;
                    imgEl.setAttribute('data-index', nextIndex);
                    imgEl.src = imgArray[nextIndex];
                } else {
                    imgEl.style.display = 'none';
                }
            } catch (e) {
                imgEl.style.display = 'none';
            }
        }

        function startCarousels() {
            const images = document.querySelectorAll('.carousel-img');
            images.forEach(imgEl => {
                if (imgEl.style.display === 'none') return; 
                const imgArray = JSON.parse(decodeURIComponent(imgEl.getAttribute('data-images')));
                if (imgArray.length > 1) {
                    const interval = setInterval(() => {
                        const currentArray = JSON.parse(decodeURIComponent(imgEl.getAttribute('data-images')));
                        if(currentArray.length <= 1) return;

                        let currentIndex = parseInt(imgEl.getAttribute('data-index'));
                        let nextIndex = (currentIndex + 1) % currentArray.length;
                        
                        imgEl.style.opacity = '0.8';
                        setTimeout(() => {
                            imgEl.src = currentArray[nextIndex];
                            imgEl.setAttribute('data-index', nextIndex);
                            imgEl.style.opacity = '1';
                        }, 200);
                    }, 3000 + Math.random() * 1000);
                    carouselIntervals.push(interval);
                }
            });
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // --- Modal Gallery Controls ---
        function updateModalImageUI() {
            const modalImg = document.getElementById('modal-img');
            const prevBtn = document.getElementById('modal-prev-btn');
            const nextBtn = document.getElementById('modal-next-btn');
            
            if (currentModalImages.length > 0) {
                modalImg.style.display = 'block';
                modalImg.src = currentModalImages[currentModalImgIndex];
                
                if (currentModalImages.length > 1) {
                    prevBtn.classList.remove('hidden');
                    prevBtn.classList.add('flex');
                    nextBtn.classList.remove('hidden');
                    nextBtn.classList.add('flex');
                } else {
                    prevBtn.classList.add('hidden');
                    prevBtn.classList.remove('flex');
                    nextBtn.classList.add('hidden');
                    nextBtn.classList.remove('flex');
                }
            } else {
                modalImg.style.display = 'none';
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        function nextModalImage(e) {
            e.stopPropagation();
            currentModalImgIndex = (currentModalImgIndex + 1) % currentModalImages.length;
            updateModalImageUI();
        }

        function prevModalImage(e) {
            e.stopPropagation();
            currentModalImgIndex = (currentModalImgIndex - 1 + currentModalImages.length) % currentModalImages.length;
            updateModalImageUI();
        }

        function openLightbox() {
            if(currentModalImages.length === 0) return;
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = currentModalImages[currentModalImgIndex];
            lightbox.classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        // --- Main Modal Actions ---
        function openModal(id) {
            currentEventData = allData.find(d => d.id === id);
            if (!currentEventData) return;

            // Setup Gallery
            currentModalImages = currentEventData.images || [];
            currentModalImgIndex = 0;
            updateModalImageUI();
            
            document.getElementById('modal-title').innerText = currentEventData.name;
            document.getElementById('modal-desc').innerText = currentEventData.description;

            // Populate Price Accordion
            const pricesContainer = document.getElementById('modal-prices');
            pricesContainer.innerHTML = '';
            if (currentEventData.priceDetails && currentEventData.priceDetails.length > 0) {
                currentEventData.priceDetails.forEach(p => {
                    pricesContainer.innerHTML += `<div class="flex justify-between border-b border-gray-100 pb-1 last:border-0 last:pb-0"><span class="text-gray-600">${p.item}</span><span class="font-bold text-gray-800">${p.cost}</span></div>`;
                });
            } else {
                const fallbackPrice = currentEventData.price === 0 ? 'Free' : `R${currentEventData.price}`;
                pricesContainer.innerHTML = `<div class="flex justify-between"><span class="text-gray-600">Standard Entry</span><span class="font-bold text-gray-800">${fallbackPrice}</span></div>`;
            }

            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentEventData.location + ', Mossel Bay')}`;
            document.getElementById('modal-nav').href = mapsUrl;

            const phoneBtn = document.getElementById('modal-phone');
            if (currentEventData.phone) {
                phoneBtn.href = `tel:${currentEventData.phone.replace(/\s+/g, '')}`;
                phoneBtn.classList.remove('hidden');
                phoneBtn.classList.add('flex');
            } else {
                phoneBtn.classList.add('hidden');
                phoneBtn.classList.remove('flex');
            }

            const webBtn = document.getElementById('modal-web');
            if (currentEventData.website && currentEventData.website !== "#" && currentEventData.website !== "") {
                webBtn.href = currentEventData.website;
                webBtn.classList.remove('hidden');
                webBtn.classList.add('flex');
            } else {
                webBtn.classList.add('hidden');
                webBtn.classList.remove('flex');
            }

            const modal = document.getElementById('event-modal');
            const content = document.getElementById('modal-content-box');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('event-modal');
            const content = document.getElementById('modal-content-box');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function shareEvent() {
            if(!currentEventData) return;
            const shareTitle = currentEventData.name;
            const shareText = `Check out ${shareTitle} in Mossel Bay!`;
            const shareUrl = window.location.href; // We can append ?id= later if deep linking is added

            if (navigator.share) {
                navigator.share({
                    title: shareTitle,
                    text: shareText,
                    url: shareUrl
                }).catch(console.error);
            } else {
                // Fallback to WhatsApp direct link for Desktop
                const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`;
                window.open(whatsappUrl, '_blank');
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
