<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-2596411121585604">
    <meta name="google-site-verification" content="QgIyntN7B1IkshgHWjAWPwkyNuYHMafYuRjia706wiA" />
    <title>MBayHoliday ☀️ Vacation Vibes</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2596411121585604" crossorigin="anonymous"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-cyan-200 via-blue-100 to-yellow-100 min-h-screen text-gray-800 antialiased relative">

    <!-- Sticky Header & Filters Container -->
    <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm border-b border-white/50">
        <header class="max-w-5xl mx-auto px-4 py-2 md:py-3 flex justify-between items-center">
            <!-- Mobile Optimized Header Text -->
            <h1 class="text-xl md:text-3xl font-black text-pink-500 tracking-tight drop-shadow-sm truncate">
                <i class="fa-solid fa-umbrella-beach text-yellow-400 mr-1 md:mr-2"></i>MBayHoliday
            </h1>
            <!-- Mobile Optimized Filter Button -->
            <button onclick="toggleFilters()" class="bg-blue-100 text-blue-700 font-bold px-3 py-1.5 md:px-4 md:py-2 text-sm md:text-base rounded-xl shadow-sm hover:bg-blue-200 transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-filter mr-1 md:mr-2"></i> Filters
            </button>
        </header>

        <!-- Expanded UX: Collapsible Filters -->
        <section id="filter-section" class="max-w-5xl mx-auto px-4 hidden pb-4">
            <div class="bg-white/80 rounded-2xl p-4 shadow-inner border border-gray-100 mt-2 backdrop-blur-sm">
                <!-- Search Bar added for better UX -->
                <div class="mb-4">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="filter-search" placeholder="Search for events, places, or keywords..." class="w-full bg-gray-50 border border-gray-200 rounded-xl py-2 pl-10 pr-4 font-bold text-gray-700 focus:ring-pink-300 outline-none" onkeyup="applyFilters()">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div>
                        <label class="block text-[10px] uppercase font-black text-gray-400 mb-1 tracking-wider">Location</label>
                        <select id="filter-location" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm font-bold text-blue-600 focus:ring-pink-300 outline-none" onchange="applyFilters()">
                            <option value="all">All</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-gray-400 mb-1 tracking-wider">Type</label>
                        <select id="filter-category" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm font-bold text-blue-600 focus:ring-pink-300 outline-none" onchange="applyFilters()">
                            <option value="all">All</option>
                            <option value="event">Events</option>
                            <option value="activity">To-Dos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-gray-400 mb-1 tracking-wider">Timeframe</label>
                        <select id="filter-date" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm font-bold text-blue-600 focus:ring-pink-300 outline-none" onchange="applyFilters()">
                            <option value="all">Anytime</option>
                            <option value="month">Next 30 Days</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase font-black text-gray-400 mb-1 tracking-wider">Max: <span id="price-display" class="text-pink-500">R2000+</span></label>
                        <input type="range" id="filter-price" min="0" max="2000" step="50" value="2000" class="w-full accent-pink-500 mt-1" oninput="updatePriceLabel(); applyFilters()">
                    </div>
                </div>
                <div class="mt-3 flex justify-end">
                    <button onclick="clearFilters()" class="text-xs font-bold text-gray-400 hover:text-red-500 transition uppercase tracking-wider">Clear Filters x</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Main Content Grid -->
    <main class="max-w-5xl mx-auto px-4 py-6 md:py-8 pb-20">
        <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
            <!-- Populated by JS -->
        </div>
        <div id="no-results" class="hidden flex-col items-center justify-center mt-12 opacity-70">
            <i class="fa-solid fa-face-frown text-5xl text-gray-400 mb-4"></i>
            <p class="text-center text-xl font-bold text-gray-500">No activities match your filters.</p>
            <button onclick="clearFilters()" class="mt-4 bg-white text-blue-600 font-bold px-6 py-2 rounded-xl shadow hover:bg-gray-50">Reset Filters</button>
        </div>
    </main>

    <!-- Popup Modal -->
    <div id="event-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[2rem] w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300 relative" id="modal-content-box">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 text-gray-800 rounded-full w-8 h-8 flex items-center justify-center shadow-md hover:bg-gray-200 z-20"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="p-6">
                <h2 id="modal-title" class="text-xl md:text-2xl font-black text-gray-800 mb-4 pr-8 leading-tight"></h2>
                
                <!-- Modal Image Slider -->
                <div class="relative w-full md:w-3/4 mx-auto h-40 bg-gray-100 rounded-xl overflow-hidden mb-5 shadow-inner group flex items-center justify-center">
                    <i class="fa-solid fa-image text-gray-300 text-3xl absolute z-0"></i>
                    <img id="modal-img" src="" class="w-full h-full object-cover relative z-10 cursor-pointer hidden" onclick="openLightbox()">
                    
                    <button id="modal-prev-btn" onclick="prevModalImage(event)" class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/90 text-gray-800 w-8 h-8 rounded-full z-20 hidden items-center justify-center shadow hover:bg-white"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                    <button id="modal-next-btn" onclick="nextModalImage(event)" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/90 text-gray-800 w-8 h-8 rounded-full z-20 hidden items-center justify-center shadow hover:bg-white"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                </div>

                <p id="modal-desc" class="text-gray-600 mb-5 text-sm md:text-base leading-relaxed"></p>
                
                <!-- Pricing Accordion -->
                <details class="mb-6 bg-gray-50 rounded-xl border border-gray-200 overflow-hidden">
                    <summary class="font-bold text-gray-700 p-3 md:p-4 cursor-pointer outline-none select-none flex items-center justify-between">
                        <span><i class="fa-solid fa-tags text-green-500 mr-2"></i> Pricing Options</span>
                        <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
                    </summary>
                    <div class="p-3 md:p-4 bg-white border-t border-gray-200 text-sm space-y-3" id="modal-prices">
                        <!-- Populated via JS -->
                    </div>
                </details>
                
                <!-- Icon Buttons -->
                <div class="flex justify-center gap-3 md:gap-4">
                    <a id="modal-nav" href="#" target="_blank" class="w-12 h-12 flex items-center justify-center bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200 transition shadow-sm text-lg" title="Google Maps">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </a>
                    <a id="modal-phone" href="#" class="hidden w-12 h-12 items-center justify-center bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition shadow-sm text-lg" title="Call">
                        <i class="fa-solid fa-phone"></i>
                    </a>
                    <a id="modal-web" href="#" target="_blank" class="hidden w-12 h-12 items-center justify-center bg-pink-100 text-pink-700 rounded-full hover:bg-pink-200 transition shadow-sm text-lg" title="Website">
                        <i class="fa-solid fa-globe"></i>
                    </a>
                    <button onclick="shareEvent()" class="w-12 h-12 flex items-center justify-center bg-gray-100 text-gray-700 rounded-full hover:bg-gray-200 transition shadow-sm text-lg" title="Share">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Lightbox -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black/95 z-[60] flex items-center justify-center p-4 transition-opacity" onclick="closeLightbox()">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-3xl z-50"><i class="fa-solid fa-xmark"></i></button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] object-contain shadow-2xl rounded-lg" onclick="event.stopPropagation()">
    </div>

    <script>
        let allData = [];
        let carouselIntervals = [];
        let currentModalImages = [];
        let currentModalImgIndex = 0;
        let currentEventData = null;

        async function loadData() {
            try {
                const response = await fetch('database.json');
                allData = await response.json();
                
                const locations = [...new Set(allData.map(item => item.location))];
                const locSelect = document.getElementById('filter-location');
                locations.sort().forEach(loc => {
                    locSelect.innerHTML += `<option value="${loc}">${loc}</option>`;
                });

                applyFilters();
            } catch (error) {
                console.error("Failed to load database.json:", error);
            }
        }

        function toggleFilters() {
            document.getElementById('filter-section').classList.toggle('hidden');
        }

        function clearFilters() {
            document.getElementById('filter-search').value = '';
            document.getElementById('filter-location').value = 'all';
            document.getElementById('filter-category').value = 'all';
            document.getElementById('filter-date').value = 'all';
            document.getElementById('filter-price').value = 2000;
            updatePriceLabel();
            applyFilters();
        }

        function updatePriceLabel() {
            const val = document.getElementById('filter-price').value;
            document.getElementById('price-display').innerText = val == 2000 ? 'R2000+' : `R${val}`;
        }

        function applyFilters() {
            const searchTerm = document.getElementById('filter-search').value.toLowerCase();
            const catFilter = document.getElementById('filter-category').value;
            const locFilter = document.getElementById('filter-location').value;
            const dateFilter = document.getElementById('filter-date').value;
            const priceFilter = parseInt(document.getElementById('filter-price').value);
            const now = new Date();
            const nextMonth = new Date();
            nextMonth.setDate(now.getDate() + 30);

            let filtered = allData.filter(item => {
                // Text Search (checks title and description)
                if (searchTerm) {
                    const textContent = `${item.name} ${item.description}`.toLowerCase();
                    if (!textContent.includes(searchTerm)) return false;
                }
                
                if (catFilter !== 'all' && item.category !== catFilter) return false;
                if (locFilter !== 'all' && item.location !== locFilter) return false;
                if (priceFilter < 2000 && item.price > priceFilter) return false;
                
                // Date logic (Next 30 days)
                if (dateFilter === 'month' && item.date) {
                    const eventDate = new Date(item.date);
                    if (eventDate < now || eventDate > nextMonth) return false;
                }
                
                return true;
            });

            filtered.sort((a, b) => {
                if (a.date && b.date) return new Date(a.date) - new Date(b.date);
                return 0;
            });

            renderContent(filtered, now);
        }

        function renderContent(data, now) {
            const container = document.getElementById('content-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';
            
            carouselIntervals.forEach(clearInterval);
            carouselIntervals = [];

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                noResults.classList.add('flex');
                return;
            }
            noResults.classList.add('hidden');
            noResults.classList.remove('flex');

            data.forEach((item) => {
                const isPast = item.date ? new Date(item.date) < now : false;
                const displayPrice = item.price === 0 ? 'Free' : `R${item.price}`;
                const cleanImages = (item.images || []).filter(img => img.trim() !== '');

                let imageTagsHtml = cleanImages.map((imgUrl, i) => `
                    <img src="${imgUrl}" class="absolute inset-0 w-full h-full object-cover z-10 transition-opacity duration-1000 carousel-item-${item.id} ${i === 0 ? 'opacity-100' : 'opacity-0'}" onerror="this.remove()">
                `).join('');

                const card = `
                    <div class="bg-white rounded-[2rem] shadow-lg border-2 border-white overflow-hidden cursor-pointer transform transition duration-300 hover:-translate-y-1 hover:shadow-xl ${isPast ? 'opacity-60' : ''}" onclick="openModal(${item.id})">
                        <div class="relative h-48 md:h-56 bg-gray-100 flex items-center justify-center">
                            <i class="fa-solid fa-image text-gray-300 text-4xl absolute z-0"></i>
                            ${imageTagsHtml}
                            ${isPast ? '<div class="absolute inset-0 bg-white/60 backdrop-blur-[2px] z-30 flex items-center justify-center"><span class="bg-red-500 text-white font-black px-4 py-1 rounded-full shadow-lg tracking-wider text-sm">ENDED</span></div>' : ''}
                            <div class="absolute top-4 left-4 z-30 flex gap-2">
                                <span class="bg-white/95 text-pink-600 font-bold px-3 py-1 rounded-xl text-xs shadow-sm uppercase tracking-wide">${item.category}</span>
                            </div>
                        </div>
                        <div class="p-5 md:p-6 relative z-30 bg-white">
                            <h2 class="text-xl md:text-2xl font-black text-gray-800 mb-3 leading-tight line-clamp-1">${item.name}</h2>
                            <div class="space-y-2 text-xs md:text-sm font-bold text-gray-500">
                                <p class="truncate"><i class="fa-regular fa-clock w-5 text-blue-400"></i> ${item.date ? formatDate(new Date(item.date)) + ' • ' : ''}${item.time}</p>
                                <p class="truncate"><i class="fa-solid fa-location-dot w-5 text-red-400"></i> ${item.location}</p>
                                <p><i class="fa-solid fa-tag w-5 text-green-400"></i> ${displayPrice}</p>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            setTimeout(() => { startCarousels(data); }, 1000);
        }

        function startCarousels(data) {
            data.forEach(item => {
                const interval = setInterval(() => {
                    const survivingImages = document.querySelectorAll(`.carousel-item-${item.id}`);
                    if (survivingImages.length <= 1) {
                        clearInterval(interval);
                        if (survivingImages.length === 1) survivingImages[0].classList.replace('opacity-0', 'opacity-100');
                        return;
                    }
                    let visibleIndex = -1;
                    survivingImages.forEach((img, index) => {
                        if (img.classList.contains('opacity-100')) visibleIndex = index;
                    });
                    if (visibleIndex === -1) visibleIndex = 0;
                    let nextIndex = (visibleIndex + 1) % survivingImages.length;
                    
                    survivingImages[visibleIndex].classList.replace('opacity-100', 'opacity-0');
                    survivingImages[nextIndex].classList.replace('opacity-0', 'opacity-100');
                }, 3500 + Math.random() * 1500);
                
                carouselIntervals.push(interval);
            });
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-ZA', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function updateModalImageUI() {
            const prevBtn = document.getElementById('modal-prev-btn');
            const nextBtn = document.getElementById('modal-next-btn');
            if (currentModalImages.length > 1) {
                prevBtn.classList.replace('hidden', 'flex');
                nextBtn.classList.replace('hidden', 'flex');
            } else {
                prevBtn.classList.replace('flex', 'hidden');
                nextBtn.classList.replace('flex', 'hidden');
            }
        }

        function nextModalImage(e) {
            e.stopPropagation();
            if (currentModalImages.length <= 1) return;
            currentModalImgIndex = (currentModalImgIndex + 1) % currentModalImages.length;
            document.getElementById('modal-img').src = currentModalImages[currentModalImgIndex];
        }

        function prevModalImage(e) {
            e.stopPropagation();
            if (currentModalImages.length <= 1) return;
            currentModalImgIndex = (currentModalImgIndex - 1 + currentModalImages.length) % currentModalImages.length;
            document.getElementById('modal-img').src = currentModalImages[currentModalImgIndex];
        }

        function openLightbox() {
            if(currentModalImages.length === 0) return;
            document.getElementById('lightbox-img').src = currentModalImages[currentModalImgIndex];
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function openModal(id) {
            currentEventData = allData.find(d => d.id === id);
            if (!currentEventData) return;

            const modalImg = document.getElementById('modal-img');
            currentModalImages = (currentEventData.images || []).filter(img => img.trim() !== '');
            currentModalImgIndex = 0;

            modalImg.onerror = function() {
                currentModalImages.splice(currentModalImgIndex, 1);
                if (currentModalImages.length > 0) {
                    currentModalImgIndex = currentModalImgIndex >= currentModalImages.length ? 0 : currentModalImgIndex;
                    modalImg.src = currentModalImages[currentModalImgIndex];
                    updateModalImageUI();
                } else {
                    modalImg.classList.add('hidden');
                    updateModalImageUI();
                }
            };

            modalImg.onload = function() { modalImg.classList.remove('hidden'); };
            if (currentModalImages.length > 0) {
                modalImg.src = currentModalImages[currentModalImgIndex];
            } else {
                modalImg.classList.add('hidden');
            }

            updateModalImageUI();
            
            document.getElementById('modal-title').innerText = currentEventData.name;
            document.getElementById('modal-desc').innerText = currentEventData.description;

            const pricesContainer = document.getElementById('modal-prices');
            pricesContainer.innerHTML = '';
            if (currentEventData.priceDetails && currentEventData.priceDetails.length > 0) {
                currentEventData.priceDetails.forEach(p => {
                    pricesContainer.innerHTML += `<div class="flex justify-between border-b border-gray-100 pb-2 mb-2 last:border-0 last:pb-0 last:mb-0"><span class="text-gray-600">${p.item}</span><span class="font-bold text-gray-800 bg-gray-100 px-2 rounded">${p.cost}</span></div>`;
                });
            } else {
                const fallbackPrice = currentEventData.price === 0 ? 'Free' : `R${currentEventData.price}`;
                pricesContainer.innerHTML = `<div class="flex justify-between"><span class="text-gray-600">Standard Entry</span><span class="font-bold text-gray-800 bg-gray-100 px-2 rounded">${fallbackPrice}</span></div>`;
            }

            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentEventData.location + ', South Africa')}`;
            document.getElementById('modal-nav').href = mapsUrl;

            const phoneBtn = document.getElementById('modal-phone');
            if (currentEventData.phone) {
                phoneBtn.href = `tel:${currentEventData.phone.replace(/\s+/g, '')}`;
                phoneBtn.classList.replace('hidden', 'flex');
            } else {
                phoneBtn.classList.replace('flex', 'hidden');
            }

            const webBtn = document.getElementById('modal-web');
            if (currentEventData.website && currentEventData.website !== "#" && currentEventData.website !== "") {
                webBtn.href = currentEventData.website;
                webBtn.classList.replace('hidden', 'flex');
            } else {
                webBtn.classList.replace('flex', 'hidden');
            }

            const modal = document.getElementById('event-modal');
            const content = document.getElementById('modal-content-box');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            content.classList.replace('scale-95', 'scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('event-modal');
            const content = document.getElementById('modal-content-box');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function shareEvent() {
            if(!currentEventData) return;
            const shareTitle = currentEventData.name;
            const shareText = `Check out ${shareTitle} happening at ${currentEventData.location}! ☀️`;
            const shareUrl = window.location.href;

            if (navigator.share) {
                navigator.share({ title: shareTitle, text: shareText, url: shareUrl }).catch(console.error);
            } else {
                window.open(`https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}`, '_blank');
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
