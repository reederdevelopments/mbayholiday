    <script>
        let allData = [];
        let allRestaurants = [];
        let filteredData = [];
        let filteredRestaurants = [];
        let carouselIntervals = [];
        let currentModalImages = [];
        let currentModalImgIndex = 0;
        let currentEventData = null;
        
        let starredIds = JSON.parse(localStorage.getItem('mbay_stars')) || [];
        let currentCalDate = new Date(); 
        let calendarMode = 'month';
        let currentView = 'scroll';

        let sponsoredItems = [];
        let currentSponsoredIndex = 0;
        let sponsoredTimer = null;

        document.getElementById('current-year').textContent = new Date().getFullYear();

        function addUTM(url) {
            if (!url || url === '#' || url.startsWith('tel:') || url.startsWith('mailto:')) return url;
            try {
                const u = new URL(url);
                u.searchParams.set('utm_source', 'mbayholiday');
                return u.toString();
            } catch (e) {
                return url + (url.includes('?') ? '&' : '?') + 'utm_source=mbayholiday';
            }
        }

        async function loadData() {
            try {
                const [eventsRes, restsRes] = await Promise.all([
                    fetch('database.json').catch(() => ({ json: () => [] })),
                    fetch('restaurant_database.json').catch(() => ({ json: () => [] }))
                ]);
                allData = await eventsRes.json();
                allRestaurants = await restsRes.json();
                
                const locations = [...new Set([...allData, ...allRestaurants].map(item => item.location))];
                const locSelect = document.getElementById('filter-location');
                locations.sort().forEach(loc => { locSelect.innerHTML += `<option value="${loc}">${loc}</option>`; });

                const rTypes = [...new Set(allRestaurants.map(item => item.type))];
                const rSelect = document.getElementById('filter-rest-type');
                rTypes.sort().forEach(t => { rSelect.innerHTML += `<option value="${t}">${t}</option>`; });

                initSponsoredCarousel();
                applyFilters();
                renderSidebar();
            } catch (error) { console.error("Failed to load databases:", error); }
        }

        // --- Sponsored Carousel Logic ---
        function initSponsoredCarousel() {
            sponsoredItems = [...allData.map(i => ({...i, isRest: false})), ...allRestaurants.map(i => ({...i, isRest: true}))].filter(item => item.sponsored);
            const container = document.getElementById('sponsored-container');
            if(sponsoredItems.length === 0) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            renderSponsoredFrame();
            renderSponsoredPills();
            startSponsoredTimer();
        }

        function startSponsoredTimer() {
            if (sponsoredTimer) clearInterval(sponsoredTimer);
            if (sponsoredItems.length > 1) {
                sponsoredTimer = setInterval(() => {
                    currentSponsoredIndex = (currentSponsoredIndex + 1) % sponsoredItems.length;
                    renderSponsoredFrame();
                    renderSponsoredPills();
                }, 5000);
            }
        }

        function setSponsoredIndex(index, event) {
            if (event) event.stopPropagation();
            currentSponsoredIndex = index;
            renderSponsoredFrame();
            renderSponsoredPills();
            startSponsoredTimer();
        }

        function renderSponsoredFrame() {
            const content = document.getElementById('sponsored-content');
            const item = sponsoredItems[currentSponsoredIndex];
            const firstImg = (item.images && item.images.length > 0) ? item.images[0] : '';
            
            content.className = "bg-white rounded-[1.6rem] overflow-hidden relative h-44 md:h-56 flex w-full fade-in-sponsored";
            content.innerHTML = `
                <div class="w-1/3 md:w-2/5 relative">
                    ${firstImg ? `<img src="${firstImg}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-gray-200 flex items-center justify-center"><i class="fa-solid fa-image text-gray-400 text-3xl"></i></div>`}
                </div>
                <div class="w-2/3 md:w-3/5 p-4 md:p-6 flex flex-col justify-center">
                    <span class="text-[10px] font-black uppercase text-pink-500 mb-1 tracking-wider">${item.category || item.type}</span>
                    <h3 class="text-xl md:text-3xl font-black text-gray-800 leading-tight mb-2 line-clamp-2">${item.name}</h3>
                    <p class="text-xs md:text-sm text-gray-500 line-clamp-2">${item.description}</p>
                    <p class="text-xs font-bold text-gray-400 mt-2"><i class="fa-solid fa-location-dot text-red-400"></i> ${item.location}</p>
                </div>
            `;
        }

        function renderSponsoredPills() {
            const pillsBox = document.getElementById('sponsored-pills');
            pillsBox.innerHTML = '';
            if (sponsoredItems.length <= 1) return;

            sponsoredItems.forEach((item, idx) => {
                const isActive = idx === currentSponsoredIndex;
                const pillClass = isActive 
                    ? 'bg-gradient-to-r from-yellow-400 to-pink-500 text-white font-black shadow-md scale-105 ring-2 ring-yellow-300/50' 
                    : 'bg-white/80 text-gray-600 font-bold hover:bg-white hover:text-gray-900 border border-white';
                
                pillsBox.innerHTML += `
                    <button onclick="setSponsoredIndex(${idx}, event)" class="text-xs px-3 py-1 rounded-full transition-all duration-300 flex items-center gap-1.5 ${pillClass}">
                        <i class="fa-solid fa-crown text-[10px] ${isActive ? 'text-yellow-200' : 'text-yellow-500'}"></i>
                        <span class="truncate max-w-[120px] md:max-w-[180px]">${item.name}</span>
                    </button>
                `;
            });
        }

        function openSponsoredModal() {
            if(sponsoredItems.length === 0) return;
            const item = sponsoredItems[currentSponsoredIndex];
            renderModalDirectly(item);
        }

        function isDateInRange(targetDate, startDateStr, endDateStr) {
            if (!startDateStr) return false;
            const start = new Date(startDateStr); start.setHours(0, 0, 0, 0);
            const target = new Date(targetDate); target.setHours(0, 0, 0, 0);
            if (!endDateStr) { return target.getTime() === start.getTime(); }
            const end = new Date(endDateStr); end.setHours(23, 59, 59, 999);
            return target >= start && target <= end;
        }

        // --- Sidebar & Star Logic ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                renderSidebar(); 
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function toggleStar(id, event) {
            if(event) event.stopPropagation();
            const index = starredIds.indexOf(id);
            if (index > -1) { starredIds.splice(index, 1); } else { starredIds.push(id); }
            localStorage.setItem('mbay_stars', JSON.stringify(starredIds));
            renderScrollContent(new Date()); renderListContent(new Date()); renderCalendar(); renderSidebar();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = '';
            const starredItems = allData.filter(item => starredIds.includes(item.id));
            if (starredItems.length === 0) {

            const dateFilter = document.getElementById('filter-date').value;

                    if (eventEnd < now || eventStart > nextMonth) return false;

        function renderCalendar() {
            const wrapper = document.getElementById('calendar-wrapper'); const header = document.getElementById('calendar-header-text');

                for(let i=0; i<7; i++) {

                    const isToday = loopDate.toDateString() === today.toDateString();
                    html += `<div class="rounded-xl min-h-[150px] p-1.5 md:p-2 overflow-y-auto cal-cell ${isToday ? 'bg-blue-50 border-2 border-blue-400' : 'bg-white border border-gray-200 hover:border-pink-300 transition'}"><div class="font-black text-xs md:text-sm ${isToday ? 'bg-blue-500 text-white rounded-full w-6 h-6 flex items-center justify-center float-right shadow-sm' : 'text-gray-400 float-right mr-1'} mb-1">${loopDate.getDate()}</div><div class="clear-both flex flex-col gap-1">${eventsHtml}</div></div>`;

            } else if (calendarMode === 'day') {
                header.innerText = `${formatDate(currentCalDate)} ${year}`; const dayEvents = filteredData.filter(item => isDateInRange(currentCalDate, item.date, item.endDate));
                if (dayEvents.length === 0) { wrapper.innerHTML = `<div class="text-center py-12 text-gray-400"><i class="fa-solid fa-calendar-xmark text-5xl mb-3"></i><p class="font-bold">No events scheduled for this day.</p></div>`; } 
                else {
                    let html = `<div class="space-y-3">`;
                    dayEvents.forEach(e => { html += `<div onclick="openModal(${e.id}, false)" class="bg-white p-4 rounded-xl shadow border border-gray-100 cursor-pointer hover:border-pink-300 transition flex items-center justify-between group"><div><p class="text-sm text-blue-500 font-bold">${e.time}</p><h3 class="text-lg font-black text-gray-800 group-hover:text-pink-600 transition">${e.name}</h3><p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot"></i> ${e.location}</p></div><button onclick="toggleStar(${e.id}, event)" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 ${starredIds.includes(e.id) ? 'text-yellow-400' : 'text-gray-300 hover:text-yellow-400'} text-xl transition"><i class="fa-solid fa-star"></i></button></div>`; });
                    wrapper.innerHTML = html + `</div>`;
                }
            }
        }

        // --- Lightbox & Modal Helpers ---
        function startCarousels(data) {
            data.forEach(item => {
                const interval = setInterval(() => {
                    const survivingImages = document.querySelectorAll(`.carousel-item-${item.id}`);
                    if (survivingImages.length <= 1) { clearInterval(interval); if (survivingImages.length === 1) survivingImages[0].classList.replace('opacity-0', 'opacity-100'); return; }
                    let visibleIndex = -1; survivingImages.forEach((img, index) => { if (img.classList.contains('opacity-100')) visibleIndex = index; });
                    if (visibleIndex === -1) visibleIndex = 0; let nextIndex = (visibleIndex + 1) % survivingImages.length;
                    survivingImages[visibleIndex].classList.replace('opacity-100', 'opacity-0'); survivingImages[nextIndex].classList.replace('opacity-0', 'opacity-100');
                }, 3500 + Math.random() * 1500); carouselIntervals.push(interval);
            });
        }

        function formatDate(date) { return date.toLocaleDateString('en-ZA', { month: 'short', day: 'numeric' }); }
        function openLightbox() { if(currentModalImages.length === 0) return; document.getElementById('lightbox-img').src = currentModalImages[currentModalImgIndex]; document.getElementById('lightbox').classList.remove('hidden'); }
        function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); }
        function prevModalImage(e) { e.stopPropagation(); if (currentModalImages.length <= 1) return; currentModalImgIndex = (currentModalImgIndex - 1 + currentModalImages.length) % currentModalImages.length; document.getElementById('modal-img').src = currentModalImages[currentModalImgIndex]; }
        function nextModalImage(e) { e.stopPropagation(); if (currentModalImages.length <= 1) return; currentModalImgIndex = (currentModalImgIndex + 1) % currentModalImages.length; document.getElementById('modal-img').src = currentModalImages[currentModalImgIndex]; }
        function updateModalImageUI() {
            const prevBtn = document.getElementById('modal-prev-btn'); const nextBtn = document.getElementById('modal-next-btn');
            if (currentModalImages.length > 1) { prevBtn.classList.replace('hidden', 'flex'); nextBtn.classList.replace('hidden', 'flex'); } 
            else { prevBtn.classList.replace('flex', 'hidden'); }
        }

        function openModal(id, isRestaurant = false) {
            currentIsRestaurant = isRestaurant;
            const targetItem = isRestaurant ? allRestaurants.find(d => d.id === id) : allData.find(d => d.id === id);
            if (targetItem) renderModalDirectly(targetItem);
        }

        function renderModalDirectly(targetItem) {
            currentEventData = targetItem;
            const isRestaurant = !!targetItem.type;

            const modalBox = document.getElementById('modal-content-box');
            const sponsorBadge = document.getElementById('modal-sponsor-badge');

            if (currentEventData.sponsored) {
                modalBox.className = "bg-white rounded-[2rem] w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300 relative border-4 border-yellow-400 ring-4 ring-yellow-300/40";
                sponsorBadge.classList.remove('hidden');
            } else {
                modalBox.className = "bg-white rounded-[2rem] w-full max-w-md max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300 relative";
                sponsorBadge.classList.add('hidden');
            }

            const modalImg = document.getElementById('modal-img');
            currentModalImages = (currentEventData.images || []).filter(img => img.trim() !== '');
            currentModalImgIndex = 0;

            modalImg.onerror = function() {
                currentModalImages.splice(currentModalImgIndex, 1);
                if (currentModalImages.length > 0) {
                    currentModalImgIndex = currentModalImgIndex >= currentModalImages.length ? 0 : currentModalImgIndex;
                    modalImg.src = currentModalImages[currentModalImgIndex];
                    updateModalImageUI();
                } else { modalImg.classList.add('hidden'); updateModalImageUI(); }
            };
            modalImg.onload = function() { modalImg.classList.remove('hidden'); };
            if (currentModalImages.length > 0) { modalImg.src = currentModalImages[currentModalImgIndex]; } 
            else { modalImg.classList.add('hidden'); }
            updateModalImageUI();
            
            document.getElementById('modal-title').innerText = currentEventData.name;
            document.getElementById('modal-desc').innerText = currentEventData.description;

            const pricesContainer = document.getElementById('modal-prices'); pricesContainer.innerHTML = '';
            if (isRestaurant) {
                document.getElementById('modal-detail-heading').innerHTML = `<i class="fa-regular fa-clock text-blue-500 mr-2"></i> Details / Times`;
                pricesContainer.innerHTML = `<div class="flex justify-between border-b border-gray-100 pb-2 mb-2"><span class="text-gray-600">Type</span><span class="font-bold text-gray-800 bg-gray-100 px-2 rounded uppercase text-[10px]">${currentEventData.type}</span></div><div class="flex justify-between"><span class="text-gray-600">Hours</span><span class="font-bold text-gray-800 bg-gray-100 px-2 rounded text-xs text-right">${currentEventData.opening_times}</span></div>`;
            } else {
                document.getElementById('modal-detail-heading').innerHTML = `<i class="fa-solid fa-tags text-green-500 mr-2"></i> Details / Pricing`;
                if (currentEventData.priceDetails && currentEventData.priceDetails.length > 0) {
                    currentEventData.priceDetails.forEach(p => { pricesContainer.innerHTML += `<div class="flex justify-between border-b border-gray-100 pb-2 mb-2 last:border-0 last:pb-0 last:mb-0"><span class="text-gray-600">${p.item}</span><span class="font-bold text-gray-800 bg-gray-100 px-2 rounded">${p.cost}</span></div>`; });
                } else {
                    const fallbackPrice = currentEventData.price === 0 ? 'Free' : `R${currentEventData.price}`;
                    pricesContainer.innerHTML = `<div class="flex justify-between"><span class="text-gray-600">Standard Entry</span><span class="font-bold text-gray-800 bg-gray-100 px-2 rounded">${fallbackPrice}</span></div>`;
                }
            }

            document.getElementById('modal-nav').href = addUTM(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(currentEventData.location + ', South Africa')}`);

            const phoneBtn = document.getElementById('modal-phone');
            if (currentEventData.phone) { phoneBtn.href = `tel:${currentEventData.phone.replace(/\s+/g, '')}`; phoneBtn.classList.replace('hidden', 'flex'); } 
            else { phoneBtn.classList.replace('flex', 'hidden'); }

            const webBtn = document.getElementById('modal-web');
            if (currentEventData.website && currentEventData.website !== "#" && currentEventData.website !== "") { webBtn.href = addUTM(currentEventData.website); webBtn.classList.replace('hidden', 'flex'); } 
            else { webBtn.classList.replace('flex', 'hidden'); }

            const modal = document.getElementById('event-modal'); const content = document.getElementById('modal-content-box');
            modal.classList.remove('hidden'); void modal.offsetWidth; 
            modal.classList.remove('opacity-0'); modal.classList.add('opacity-100');
            content.classList.replace('scale-95', 'scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('event-modal'); const content = document.getElementById('modal-content-box');
            modal.classList.remove('opacity-100'); modal.classList.add('opacity-0');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
