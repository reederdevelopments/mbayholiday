<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBayHoliday - Mosselbay Vacation Guide</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: 600; }
        .tab-inactive { color: #6b7280; font-weight: 400; }
        .ended-overlay { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6); z-index: 10; display: flex; align-items: center; justify-content: center; backdrop-filter: grayscale(100%); }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider"><i class="fa-solid fa-sun text-yellow-300 mr-2"></i>MBayHoliday</h1>
            <p class="hidden sm:block text-sm font-light">Your Mosselbay Vacation Guide</p>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white shadow-sm mb-6 sticky top-[68px] z-40">
        <div class="max-w-5xl mx-auto px-4 flex">
            <button id="btn-events" class="flex-1 py-4 text-center tab-active transition" onclick="switchTab('events')">
                <i class="fa-regular fa-calendar-days mr-2"></i> Upcoming Events
            </button>
            <button id="btn-activities" class="flex-1 py-4 text-center tab-inactive transition" onclick="switchTab('activities')">
                <i class="fa-solid fa-map-location-dot mr-2"></i> Local To-Dos
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto px-4 pb-12">
        <!-- Error State -->
        <div id="error-message" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6">
            <p class="font-bold">Error loading data.</p>
            <p>Please ensure you are viewing this via a local server or GitHub pages, not just double-clicking the file (due to CORS).</p>
        </div>

        <!-- Events Container -->
        <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Populated by JS -->
        </div>

        <!-- Activities Container -->
        <div id="activities-container" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Populated by JS -->
        </div>
    </main>

    <script>
        let allData = [];

        // Fetch JSON Data
        async function loadData() {
            try {
                const response = await fetch('database.json');
                if (!response.ok) throw new Error('Network response was not ok');
                allData = await response.json();
                renderContent();
            } catch (error) {
                console.error("Failed to load database.json:", error);
                document.getElementById('error-message').classList.remove('hidden');
            }
        }

        // Render HTML based on fetched data
        function renderContent() {
            const eventsContainer = document.getElementById('events-container');
            const activitiesContainer = document.getElementById('activities-container');
            const now = new Date();

            let eventsHtml = '';
            let activitiesHtml = '';
            let firstUpcomingId = null;

            // Separate and sort events
            const events = allData.filter(item => item.category === 'event')
                                  .sort((a, b) => new Date(a.date) - new Date(b.date));
            const activities = allData.filter(item => item.category === 'activity');

            // Render Events
            events.forEach(event => {
                const eventDate = new Date(event.date);
                const isPast = eventDate < now;
                
                // Identify the first event that hasn't passed yet
                if (!isPast && !firstUpcomingId) {
                    firstUpcomingId = `event-${event.id}`;
                }

                eventsHtml += `
                    <div id="event-${event.id}" class="bg-white rounded-xl shadow-md overflow-hidden relative ${isPast ? 'opacity-70 grayscale' : 'transform transition hover:-translate-y-1 hover:shadow-lg'}">
                        ${isPast ? '<div class="absolute top-4 right-4 bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full z-20 shadow">ENDED</div>' : ''}
                        <img src="${event.image}" alt="${event.name}" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <h2 class="text-xl font-bold mb-2 text-gray-800">${event.name}</h2>
                            <div class="text-sm text-gray-600 space-y-2 mb-4">
                                <p><i class="fa-regular fa-clock w-5 text-blue-500"></i> ${formatDate(eventDate)} • ${event.time}</p>
                                <p><i class="fa-solid fa-location-dot w-5 text-red-500"></i> ${event.location}</p>
                                <p><i class="fa-solid fa-tag w-5 text-green-500"></i> ${event.price}</p>
                            </div>
                            <p class="text-gray-700 text-sm mb-4 line-clamp-3">${event.description}</p>
                            ${event.link && event.link !== "#" ? `<a href="${event.link}" target="_blank" class="block w-full text-center bg-blue-100 text-blue-700 font-semibold py-2 rounded-lg hover:bg-blue-200 transition">View Details</a>` : ''}
                        </div>
                    </div>
                `;
            });

            // Render Activities
            activities.forEach(activity => {
                activitiesHtml += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden transform transition hover:-translate-y-1 hover:shadow-lg">
                        <img src="${activity.image}" alt="${activity.name}" class="w-full h-48 object-cover">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="text-xl font-bold text-gray-800">${activity.name}</h2>
                                <span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2.5 py-0.5 rounded">To-Do</span>
                            </div>
                            <div class="text-sm text-gray-600 space-y-2 mb-4">
                                <p><i class="fa-regular fa-clock w-5 text-blue-500"></i> ${activity.time}</p>
                                <p><i class="fa-solid fa-location-dot w-5 text-red-500"></i> ${activity.location}</p>
                                <p><i class="fa-solid fa-tag w-5 text-green-500"></i> ${activity.price}</p>
                            </div>
                            <p class="text-gray-700 text-sm mb-4">${activity.description}</p>
                            ${activity.link && activity.link !== "#" ? `<a href="${activity.link}" target="_blank" class="block w-full text-center bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition">Contact / Book</a>` : ''}
                        </div>
                    </div>
                `;
            });

            eventsContainer.innerHTML = eventsHtml || '<p class="col-span-full text-center text-gray-500">No events found.</p>';
            activitiesContainer.innerHTML = activitiesHtml || '<p class="col-span-full text-center text-gray-500">No activities found.</p>';

            // Auto-scroll to latest upcoming event
            if (firstUpcomingId) {
                setTimeout(() => {
                    const upcomingElement = document.getElementById(firstUpcomingId);
                    if (upcomingElement) {
                        const yOffset = -150; // Offset for sticky headers
                        const y = upcomingElement.getBoundingClientRect().top + window.pageYOffset + yOffset;
                        window.scrollTo({top: y, behavior: 'smooth'});
                        
                        // Highlight briefly to draw attention
                        upcomingElement.classList.add('ring-4', 'ring-blue-400', 'ring-opacity-50');
                        setTimeout(() => upcomingElement.classList.remove('ring-4', 'ring-blue-400', 'ring-opacity-50'), 2000);
                    }
                }, 100); // small delay to ensure rendering is complete
            }
        }

        // Helper to format date
        function formatDate(date) {
            return date.toLocaleDateString('en-ZA', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        }

        // Tab Switching Logic
        function switchTab(tabId) {
            const btnEvents = document.getElementById('btn-events');
            const btnActivities = document.getElementById('btn-activities');
            const eventsContainer = document.getElementById('events-container');
            const activitiesContainer = document.getElementById('activities-container');

            if (tabId === 'events') {
                btnEvents.className = "flex-1 py-4 text-center tab-active transition";
                btnActivities.className = "flex-1 py-4 text-center tab-inactive transition hover:bg-gray-50";
                eventsContainer.classList.remove('hidden');
                activitiesContainer.classList.add('hidden');
                
                // Re-trigger auto-scroll when clicking back to events tab
                renderContent(); 
            } else {
                btnActivities.className = "flex-1 py-4 text-center tab-active transition";
                btnEvents.className = "flex-1 py-4 text-center tab-inactive transition hover:bg-gray-50";
                activitiesContainer.classList.remove('hidden');
                eventsContainer.classList.add('hidden');
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
